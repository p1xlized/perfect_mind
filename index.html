<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + Preact + Typescript</title>
    <style>
      :root {
        --background: oklch(0.9842 0.0034 247.8575);
        --foreground: oklch(0.3013 0.024 238.809);
        background: var(--background);
        color: var(--foreground);
      }

      :root.dark {
        --background: oklch(0.18 0.02 260);
        --foreground: oklch(0.98 0.01 180);
      }

      html,
      body,
      #root {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: inherit;
      }

      .app-loader {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      .app-loader__mark {
        width: 2rem;
        height: 2rem;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 9999px;
        animation: app-loader-spin 0.8s linear infinite;
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      const savedTheme = localStorage.getItem("app-theme");
      const savedMode = localStorage.getItem("color-mode");
      if (savedTheme === "forest" || savedTheme === "sunset") {
        document.documentElement.dataset.theme = savedTheme;
      }
      if (savedMode === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body>
    <div id="root">
      <div class="app-loader" role="status" aria-label="Loading">
        <div class="app-loader__mark"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
